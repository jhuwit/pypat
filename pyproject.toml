[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pypat"
version = "0.1.0"
description = "Fine-tune pretrained PAT models on accelerometry outcomes"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "tensorflow",
]

[project.optional-dependencies]
rds = ["pyreadr"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
